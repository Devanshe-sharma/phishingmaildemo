<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phishing Awareness</title>
  <style>
    body { 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f9;
      color: #333;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .box {
      border: 2px solid #555;
      padding: 40px;
      border-radius: 10px;
      background: white;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }
    h1 { color: #d9534f; }
    p { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎣 You’ve Been Fooled!</h1>
    <p>This was a phishing awareness test. Always check the sender, links, and spelling before clicking.</p>
    <p><strong>Be Safe. Be Smart. Be Secure.</strong></p>
  </div>
</body>
</html>
